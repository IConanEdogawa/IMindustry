name: Build and Release Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build jar
      run: gradle jar --no-daemon --stacktrace

    - name: Show jar contents
      run: |
        echo "=== JAR contents ==="
        jar tf build/libs/IMindustry.jar || true
        echo "=== End ==="

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: IMindustry
        path: build/libs/*.jar

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.2.2
        name: IMindustry v0.2.2
        body: |
          Test release v0.2.2

          If you still get ClassNotFound, delete the old mod completely before importing.
        files: build/libs/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
