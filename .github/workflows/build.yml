name: Build and Release Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build jar
      run: gradle jar --no-daemon --stacktrace

    - name: List built files
      run: ls -la build/libs/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: IMindustry
        path: build/libs/*.jar

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.2.0
        name: IMindustry v0.2.0
        body: |
          **IMindustry** — enhanced early turrets

          ### Current features
          - **Duo**: Titanium (2× damage + Slow) + Sand (strong knockback)
          - **Scatter**: Silicon (homing + 6 shrapnel fragments)

          ### How to install
          1. Download the `.jar` from Assets below
          2. Put it into your Mindustry `mods/` folder

          Or simply paste the repository link in Mindustry → Import mod → GitHub
        files: build/libs/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
